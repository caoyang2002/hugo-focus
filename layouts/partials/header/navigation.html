<div class="header_nav-wrapper">
    <nav class="header_nav-menu">
        {{ with site.Menus.main }}
            {{ range . }}
                {{ if .HasChildren }}
                    {{/* 有子项的主按钮：不可点击跳转，仅展开下拉 */}}
                    <div class="header_nav-group">
                        <button
                            type="button"
                            aria-haspopup="true"
                            class="header_nav-toggle header_nav-menu-item"
                        >
                            {{ if eq .Params.icon "search" }}
                                {{/* 放大镜图标 */}}
                                <svg class="header_nav-icon-search" fill="none" viewBox="0 0 24 24"
                                     stroke="currentColor" stroke-width="2" aria-hidden="true">
                                    <circle cx="11" cy="11" r="7"></circle>
                                    <path stroke-linecap="round" d="M20.5 20.5l-4.2-4.2"></path>
                                </svg>
                                <span class="header_nav-sr-only">{{ .Name }}</span>
                            {{ else }}
                                {{ .Name }}
                                <svg class="header_nav-icon-chevron" viewBox="0 0 20 20"
                                     fill="currentColor" aria-hidden="true">
                                    <path fill-rule="evenodd"
                                          d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"
                                          clip-rule="evenodd"/>
                                </svg>
                            {{ end }}
                        </button>

                        <div class="header_nav-submenu">
                            {{ range .Children }}
                                <a href="{{ .URL }}">{{ .Name }}</a>
                            {{ end }}
                        </div>
                    </div>
                {{ else }}
                    {{/* 无子项的主按钮（当前配置不会出现，保留兜底）*/}}
                    <a href="{{ .URL }}" class="header_nav-link header_nav-menu-item">
                        {{ .Name }}
                    </a>
                {{ end }}
            {{ end }}
        {{ end }}

        <div class="header_nav-language-selector language-selector">
            {{ partial "language-selector.html" . }}
        </div>
    </nav>
</div>
