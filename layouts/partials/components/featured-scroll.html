{{- /* 接收传入的精选文章 */ -}}
{{- $featured := . -}}
{{- if $featured -}}

{{- /* 引入组件样式与脚本（Hugo Pipes） */ -}}
<!--{{- $css := resources.Get "css/featured-scroll.css" | minify | fingerprint -}}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">-->


<div class="featured-scroll-component">
    <div class="featured-scroll-header">
        <h2 class="featured-scroll-title">
            <svg
                class="featured-scroll-title-icon"
                fill="currentColor"
                viewBox="0 0 20 20"
                aria-hidden="true"
            >
                <path
                    d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"
                ></path>
            </svg>
            精选文章
            <span class="featured-scroll-count">
                ({{ len $featured }}篇)
            </span>
        </h2>
    </div>

    <!-- 滚动容器 -->
    <div class="scroll-wrapper">
        <div class="scroll-container">
            <div class="scroll-content">
                {{- range $featured -}}
                <div class="scroll-item">
                    {{ partial "list/article-card.html" . }}
                </div>
                {{- end -}}
            </div>
        </div>

        <!-- 导航按钮 -->
        <button class="scroll-btn scroll-btn-prev" aria-label="上一页">
            <svg class="scroll-btn-icon" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                <path
                    fill-rule="evenodd"
                    d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"
                    clip-rule="evenodd"
                />
            </svg>
        </button>
        <button class="scroll-btn scroll-btn-next" aria-label="下一页">
            <svg class="scroll-btn-icon" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                <path
                    fill-rule="evenodd"
                    d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
                    clip-rule="evenodd"
                />
            </svg>
        </button>
    </div>
</div>

{{- $js := resources.Get "js/featured-scroll.js" | minify | fingerprint -}}
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>

{{- end -}}
