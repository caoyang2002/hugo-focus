<div class="all-categories">
    <div class="section-header" data-toggle="categories" style="cursor: pointer">
        <h3 class="section-title">
            {{ i18n "all_categorites" }}
            <span class="toggle-icon" id="categories-icon">▼</span>
        </h3>
    </div>
    <div class="categories-list" id="categories-content" style="display: block">
        {{ range $name, $taxonomy := .Site.Taxonomies.categories }}
        <a
            class="categories-link"
            href='{{ printf "categories/%s" ($name | urlize) | relLangURL }}'
        >
            {{ $name }} ({{ len $taxonomy }})
        </a>
        {{ end }}
    </div>
</div>
