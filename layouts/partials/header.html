<header class="site-header">
    <!-- 左侧：品牌 + 主题切换 -->
    <div class="site-header__brand-zone">
        {{ partial "header/brand" . }} {{ partial "header/theme-toggle" . }}
    </div>

    <!-- 移动端菜单按钮 -->
    {{ partial "header/mobile-toggle" . }}

    <!-- 主导航 -->
    {{ partial "header/navigation" . }}
</header>

<script>
    // 基础初始化
    const htmlClass = document.documentElement.classList;
    setTimeout(() => htmlClass.remove("not-ready"), 10);

    // 移动菜单功能
    const btnMenu = document.querySelector(".btn-menu");
    const navWrapper = document.querySelector(".header_nav-wrapper");
    const desktopQuery = window.matchMedia("(min-width: 1024px)");

    function setMenu(open) {
        htmlClass.toggle("open", open);
        htmlClass.toggle("close", !open);
        if (btnMenu) btnMenu.setAttribute("aria-expanded", String(open));

        if (!open) {
            document.querySelectorAll(".header_nav-group.is-open").forEach((group) => {
                group.classList.remove("is-open");
                const toggle = group.querySelector(".header_nav-toggle");
                if (toggle) toggle.setAttribute("aria-expanded", "false");
            });
        }
    }

    if (btnMenu) {
        setMenu(false);
        btnMenu.addEventListener("click", () => {
            setMenu(!htmlClass.contains("open"));
        });
        btnMenu.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                setMenu(!htmlClass.contains("open"));
            }
        });
    }

    if (navWrapper) {
        navWrapper.addEventListener("click", (event) => {
            const groupToggle = event.target.closest(".header_nav-toggle");
            if (groupToggle && !desktopQuery.matches) {
                const group = groupToggle.closest(".header_nav-group");
                if (group) {
                    const isOpen = group.classList.toggle("is-open");
                    groupToggle.setAttribute("aria-expanded", String(isOpen));
                }
                return;
            }

            if (event.target.closest("a")) {
                setMenu(false);
            }
        });
    }

    document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") setMenu(false);
    });

    desktopQuery.addEventListener("change", (event) => {
        if (event.matches) setMenu(false);
    });

    // 主题管理
    const themeManager = {
        metaTheme: document.querySelector('meta[name="theme-color"]'),
        lightBg: "{{ $.Scratch.Get "bg_color" }}".replace(/"/g, ""),
        btnDark: document.querySelector(".btn-dark"),

        init() {
            const darkScheme = window.matchMedia("(prefers-color-scheme: dark)");
            const isDark = localStorage.getItem("dark") === "true" ||
                          (localStorage.getItem("dark") === null && darkScheme.matches);
            this.setTheme(isDark);

            darkScheme.addEventListener("change", (e) => this.setTheme(e.matches));
            if (this.btnDark) {
                this.btnDark.addEventListener("click", () => this.toggleTheme());
            }
        },

        setTheme(isDark) {
            this.metaTheme?.setAttribute("content", isDark ? "#000" : this.lightBg);
            htmlClass[isDark ? "add" : "remove"]("dark");
            localStorage.setItem("dark", isDark);
        },

        toggleTheme() {
            this.setTheme(localStorage.getItem("dark") !== "true");
        }
    };

    themeManager.init();
</script>
