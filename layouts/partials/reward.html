{{ $wechat_code := site.Params.WechatPaymentCode }}
{{ $ali_code := site.Params.AlipayPaymentCode }}
{{ $css := resources.Get "css/reward.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}">

{{ $js := resources.Get "js/reward.js" | minify | fingerprint }}
<script src="{{ $js.RelPermalink }}" defer></script>

<div class="reward-container">
    <button
        class="reward-button"
        aria-expanded="false"
        aria-controls="reward-pop"
    >
        支持作者
    </button>
    <div id="reward-pop" class="reward-popup hidden">
        <p class="reward-text">感谢支持！🍻</p>
        <div class="qr-container">
            <div class="reward-qr">
                <img src="{{ $wechat_code }}" alt="微信支付二维码" loading="lazy" />
                <p>微信</p>
            </div>
            <div class="reward-qr">
                <img src="{{ $ali_code }}" alt="支付宝二维码" loading="lazy" />
                <p>支付宝</p>
            </div>
        </div>
    </div>
</div>
